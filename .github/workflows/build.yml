name: SXG-Create-NF Autobuild

# Releases contain the patcher (patcher.py frozen with PyInstaller) for Windows, Linux and macOS
# (Apple Silicon and Intel). The patcher runs the same converter as main.py, so it always produces the
# same plugins as the Python script, which stays in the repository for development.

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'patcher*.py'
      - 'utility/**'
      - '!utility/dev/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sxg-create-nf-autobuild
  cancel-in-progress: false

jobs:
  version:
    name: Determine release number
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Python syntax
        run: python3 -m py_compile main.py patcher.py patcher_i18n.py utility/*.py

      - name: Next release number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let max = 0;
            for (const r of releases) {
              const m = r.tag_name.match(/^autobuild-r(\d+)$/);
              if (m) max = Math.max(max, parseInt(m[1], 10));
            }
            core.setOutput('revision', max + 1);
            core.setOutput('tag', `autobuild-r${max + 1}`);
            console.log(`Next autobuild: r${max + 1}`);

  build:
    name: Patcher ${{ matrix.label }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, label: Windows,           asset: windows }
          - { os: ubuntu-22.04,   label: Linux,             asset: linux }
          - { os: macos-15,       label: macOS Apple Silicon, asset: macos-applesilicon }
          - { os: macos-15-intel, label: macOS Intel,       asset: macos-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build patcher
        env:
          REVISION: r${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          echo "VERSION = '$REVISION'" > patcher_version.py
          HIDDEN=""
          for f in utility/*.py; do HIDDEN="$HIDDEN --hidden-import $(basename "$f" .py)"; done
          python -m PyInstaller --onefile --windowed --noconfirm --clean \
            --name SXG-Create-NF-Patcher \
            --paths utility --paths . \
            --add-data "utility/bitmaps:bitmaps" \
            --hidden-import main --hidden-import patcher_i18n --hidden-import patcher_version $HIDDEN \
            patcher.py
          ls -la dist

      - name: Self test and package
        env:
          NAME: SXG-Create-NF-Patcher-r${{ needs.version.outputs.revision }}-${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p upload
          case "${{ runner.os }}" in
            Windows)
              ./dist/SXG-Create-NF-Patcher.exe --selftest
              cp dist/SXG-Create-NF-Patcher.exe "upload/$NAME.exe" ;;
            Linux)
              ./dist/SXG-Create-NF-Patcher --selftest
              tar -C dist -czf "upload/$NAME.tar.gz" SXG-Create-NF-Patcher ;;
            macOS)
              ./dist/SXG-Create-NF-Patcher.app/Contents/MacOS/SXG-Create-NF-Patcher --selftest
              ditto -c -k --keepParent dist/SXG-Create-NF-Patcher.app "upload/$NAME.zip" ;;
          esac
          ls -la upload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: patcher-${{ matrix.asset }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download patchers
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -la assets

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: Autobuild r${{ needs.version.outputs.revision }}
          prerelease: true
          artifacts: assets/*
          artifactErrorsFailBuild: true
          body: |
            The **SXG-Create-NF Patcher** converts **Yamaha MU** ROMs into plugins for the **S-YXG50** soft synth.

            **SUPPORTED MODELS**
            - MU50, MU80, MU90 / MU90B, MU100 / MU100B, MU128, MU1000 (MU2000: uses the MU1000 set)

            **DOWNLOAD**
            - Windows: `...-windows.exe`
            - Linux: `...-linux.tar.gz` (extract, then run `SXG-Create-NF-Patcher`)
            - macOS: `...-macos-applesilicon.zip` (M1 and newer) or `...-macos-intel.zip` (extract, then open the app)

            **INSTRUCTIONS**
            - Put the patcher in a folder together with your MU ROM files and the original `syxg50.dll` (626,688 bytes); subfolders are fine. The patcher can also be pointed to another folder or to the DLL.
            - Start it, check the list of found models, click **Patch**.
            - The plugins (one DLL per model, tables inside) end up in the folder `Plugins` next to the patcher.
            - The files are not signed: Windows SmartScreen and macOS Gatekeeper warn on the first start. See README.md ("Patcher") for how to start it anyway.

      - name: Delete previous Autobuild releases and tags
        uses: actions/github-script@v8
        env:
          CURRENT_REVISION: ${{ needs.version.outputs.revision }}
          CURRENT_TAG: ${{ needs.version.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRevision = parseInt(process.env.CURRENT_REVISION, 10);
            const currentTag = process.env.CURRENT_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              const match = release.tag_name.match(/^autobuild-r(\d+)$/);
              if (!match || release.tag_name === currentTag) continue;
              if (parseInt(match[1], 10) >= currentRevision) continue;
              console.log(`Deleting old Autobuild release ${release.tag_name}.`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
