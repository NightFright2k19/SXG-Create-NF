name: SXG-Create-NF Autobuild

# Releases contain the patcher (patcher.py frozen with PyInstaller) for Windows, Linux and macOS
# (Apple Silicon and Intel). The patcher runs the same converter as main.py, so it always produces the
# same plugins as the Python script, which stays in the repository for development.
# Plugin templates (issue #40, utility/template.py): the first job makes them again from source/syxg50.dll
# and commits them to templates/ when they changed; the patchers are built from that commit and carry the
# templates in one 7z archive (LZMA2, Ultra, largest dictionary), so users no longer need syxg50.dll.
# Older Autobuild releases are kept for regression tests; only the newest one is marked as Latest.

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'patcher*.py'
      - 'utility/**'
      - '!utility/dev/**'
      - 'source/syxg50.dll'
      - 'templates/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sxg-create-nf-autobuild
  cancel-in-progress: false

jobs:
  templates:
    name: Plugin templates
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the templates' version date is the date of the last commit of their sources

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make templates
        run: python utility/template.py --make --check

      - name: Commit changed templates
        id: commit
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain templates)" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add templates
            git commit -m 'Update plugin templates' -m "Made from $(git rev-parse --short HEAD) by the Autobuild workflow."
            git pull --rebase origin main
            git push origin HEAD:main
          elif [ -n "$(git status --porcelain templates)" ]; then
            echo "::warning::templates changed, not committed outside main"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pack templates (7z, LZMA2, Ultra)
        run: |
          set -euo pipefail
          # -md: largest LZMA2 dictionary (7-Zip reduces it to the size of the data); -mf=off: no BCJ filter
          # (utility/template.py reads LZMA2 only); -mhc=off and no time stamps: plain header, same archive for same templates
          7z a -t7z -m0=LZMA2 -mx=9 -mfb=273 -md=1536m -ms=on -mf=off -mhc=off -mtm=off -mtc=off -mta=off templates.7z ./templates/*.tpl
          ls -la templates templates.7z

      - name: Upload templates
        uses: actions/upload-artifact@v4
        with:
          name: templates
          path: templates.7z
          if-no-files-found: error

  version:
    name: Determine release number
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Python syntax
        run: python3 -m py_compile main.py patcher.py patcher_i18n.py utility/*.py

      - name: Next release number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let max = 0;
            for (const r of releases) {
              const m = r.tag_name.match(/^autobuild-r(\d+)$/);
              if (m) max = Math.max(max, parseInt(m[1], 10));
            }
            core.setOutput('revision', max + 1);
            core.setOutput('tag', `autobuild-r${max + 1}`);
            console.log(`Next autobuild: r${max + 1}`);

  build:
    name: Patcher ${{ matrix.label }}
    needs: [version, templates]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, label: Windows,           asset: windows }
          - { os: ubuntu-22.04,   label: Linux,             asset: linux }
          - { os: macos-15,       label: macOS Apple Silicon, asset: macos-applesilicon }
          - { os: macos-15-intel, label: macOS Intel,       asset: macos-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.templates.outputs.sha }}

      - name: Download templates
        uses: actions/download-artifact@v4
        with:
          name: templates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller certifi

      - name: Build patcher
        env:
          REVISION: r${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          echo "VERSION = '$REVISION'" > patcher_version.py
          HIDDEN=""
          for f in utility/*.py; do HIDDEN="$HIDDEN --hidden-import $(basename "$f" .py)"; done
          case "${{ runner.os }}" in                  # program icon: .ico (Windows), .icns (macOS); Linux has none
            Windows) ICON="--icon utility/icons/patcher.ico" ;;
            macOS)   ICON="--icon utility/icons/patcher.icns" ;;
            *)       ICON="" ;;
          esac
          python -m PyInstaller --onefile --windowed --noconfirm --clean $ICON \
            --name SXG-Create-NF-Patcher \
            --paths utility --paths . \
            --add-data "utility/bitmaps:bitmaps" \
            --add-data "utility/icons:icons" \
            --add-data "templates.7z:." \
            --hidden-import main --hidden-import patcher_i18n --hidden-import patcher_version --hidden-import certifi $HIDDEN \
            patcher.py
          ls -la dist

      - name: Self test and package
        env:
          NAME: SXG-Create-NF-Patcher-r${{ needs.version.outputs.revision }}-${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p upload
          case "${{ runner.os }}" in
            Windows)
              ./dist/SXG-Create-NF-Patcher.exe --selftest
              cp dist/SXG-Create-NF-Patcher.exe "upload/$NAME.exe" ;;
            Linux)
              ./dist/SXG-Create-NF-Patcher --selftest
              tar -C dist -czf "upload/$NAME.tar.gz" SXG-Create-NF-Patcher ;;
            macOS)
              ./dist/SXG-Create-NF-Patcher.app/Contents/MacOS/SXG-Create-NF-Patcher --selftest
              ditto -c -k --keepParent dist/SXG-Create-NF-Patcher.app "upload/$NAME.zip" ;;
          esac
          ls -la upload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: patcher-${{ matrix.asset }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, templates, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download patchers
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -la assets

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          commit: ${{ needs.templates.outputs.sha }}
          name: Autobuild r${{ needs.version.outputs.revision }}
          prerelease: false
          makeLatest: true
          artifacts: assets/*
          artifactErrorsFailBuild: true
          body: |
            The **SXG-Create-NF Patcher** converts **Yamaha MU** ROMs into plugins for the **S-YXG50** soft synth and patches Yamaha's **S-YXG2006LE** into a plugin that runs in any host.

            **SUPPORTED MODELS**
            - MU50, MU80, MU90 / MU90B, MU100 / MU100B, MU128, MU1000, MU2000 (h/l pair or the `mu2000_flash.bin` of the S-MU2000 ROM folder; only when no MU1000 set is there, same sound)
            - S-YXG2006LE (Yamaha's own engine and tables, not converted: `SGP2.OLD` or `SGP2.DLL`, also one patched by SGP2VSTi 1.0.2.22 such as `S-YXG2006LE.DLL`; `sxgbnw6l.tbl`, `sxgdat6l.tbl`)

            **DOWNLOAD**
            - Windows: `...-windows.exe`
            - Linux: `...-linux.tar.gz` (extract, then run `SXG-Create-NF-Patcher`)
            - macOS: `...-macos-applesilicon.zip` (M1 and newer) or `...-macos-intel.zip` (extract, then open the app)

            **INSTRUCTIONS**
            - Put the patcher in a folder together with your MU ROM files and/or the three S-YXG2006LE files; subfolders are fine. The patcher can also be pointed to another folder.
            - `syxg50.dll` is **no longer needed**: the patcher carries ready-patched plugin templates (without any ROM data) and only writes the converted ROMs into them. The S-YXG2006LE still needs your own `SGP2.OLD` or `SGP2.DLL`.
            - Start it, check the list of found models, click **Patch**. MU models and the S-YXG2006LE are built in the same run; each also works on its own.
            - The plugins (one DLL per model, tables inside; `syxg2006le.dll` for the S-YXG2006LE) end up in the folder `Plugins` next to the patcher.

            **WHAT'S NEW**
            - See the [version history](https://github.com/NightFright2k19/SXG-Create-NF/blob/main/docs/versions.md) for the changes of every release.

      - name: Keep previous Autobuild releases without a label
        uses: actions/github-script@v8
        env:
          CURRENT_TAG: ${{ needs.version.outputs.tag }}
        with:
          script: |
            // Older Autobuilds stay available for regression tests; only the newest one is marked
            // Latest (set when it is created). Pre-release labels left from earlier workflow versions are removed.
            // GitHub lists releases by the date of their commit, so the newest is on top.
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = process.env.CURRENT_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              if (!/^autobuild-r\d+$/.test(release.tag_name) || release.tag_name === currentTag) continue;
              if (!release.prerelease) continue;
              console.log(`Removing the pre-release label from ${release.tag_name}.`);
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, prerelease: false, make_latest: 'false' });
            }
